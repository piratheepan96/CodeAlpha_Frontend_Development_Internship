<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Gallery | CodeAlpha</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <h1>Image Gallery</h1>
        <p>CodeAlpha Frontend Development Internship</p>
    </header>

    <main>

        <!-- Filter Buttons -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">
                All
            </button>

            <button class="filter-btn" data-filter="nature">
                Nature
            </button>

            <button class="filter-btn" data-filter="travel">
                Travel
            </button>

            <button class="filter-btn" data-filter="city">
                City
            </button>
        </div>

        <!-- Image Gallery -->
        <section class="gallery">

            <div class="gallery-item" data-category="nature">
                <img src="images/nature.jpg" alt="Beautiful Nature">
                <h3>Nature</h3>
            </div>

            <div class="gallery-item" data-category="travel">
                <img src="images/beach.jpg" alt="Beautiful Beach">
                <h3>Beach</h3>
            </div>

            <div class="gallery-item" data-category="nature">
                <img src="images/mountain.jpg" alt="Mountain Landscape">
                <h3>Mountain</h3>
            </div>

            <div class="gallery-item" data-category="nature">
                <img src="images/forest.jpg" alt="Green Forest">
                <h3>Forest</h3>
            </div>

            <div class="gallery-item" data-category="city">
                <img src="images/city.jpg" alt="Modern City">
                <h3>City</h3>
            </div>

            <div class="gallery-item" data-category="nature">
                <img src="images/sunset.jpg" alt="Beautiful Sunset">
                <h3>Sunset</h3>
            </div>

            <div class="gallery-item" data-category="nature">
                <img src="images/flowers.jpg" alt="Beautiful Flowers">
                <h3>Flowers</h3>
            </div>

            <div class="gallery-item" data-category="nature">
                <img src="images/wildlife.jpg" alt="Wildlife">
                <h3>Wildlife</h3>
            </div>

        </section>

    </main>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">

        <button class="close" aria-label="Close">
            &times;
        </button>

        <button class="prev" aria-label="Previous image">
            &#10094;
        </button>

        <img id="lightbox-image" src="" alt="Selected Gallery Image">

        <button class="next" aria-label="Next image">
            &#10095;
        </button>

    </div>

    <footer class="footer">
        <p>
            © 2026 Kanthasamy Piratheepan |
            CodeAlpha Frontend Development Internship
        </p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
